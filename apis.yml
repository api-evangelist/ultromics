aid: ultromics
name: Ultromics
description: >-
  Ultromics is a UK-based clinical AI company, spun out of the University of
  Oxford and backed by GV, whose EchoGo platform applies FDA 510(k)-cleared
  AI to routine echocardiograms to help clinicians detect heart failure with
  preserved ejection fraction (HFpEF) and cardiac amyloidosis. EchoGo
  integrates into existing hospital echo workflows and PACS environments,
  delivering results through clinical systems rather than a public developer
  API.
